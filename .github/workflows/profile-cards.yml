name: Refresh profile cards

on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_cards.py
      - fonts/**
      - assets/**

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refresh data/github.json. The default GITHUB_TOKEN only sees public contributions;
      # add a PROFILE_TOKEN secret (classic PAT, read:user) to include private ones.
      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                login
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      name description url stargazerCount forkCount
                      primaryLanguage { name color }
                    }
                  }
                }
              }
            }' > /tmp/raw.json
          mkdir -p data
          jq '{
                login: .data.user.login,
                generated: (now | todate),
                total: .data.user.contributionsCollection.contributionCalendar.totalContributions,
                days: [.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]
                       | {date, count: .contributionCount}],
                repos: [.data.user.pinnedItems.nodes[]
                        | {name, description, url, stars: .stargazerCount, forks: .forkCount,
                           language: .primaryLanguage.name, languageColor: .primaryLanguage.color}]
              }' /tmp/raw.json > data/github.json

      - name: Render cards
        run: |
          pip install fonttools Pillow
          python scripts/render_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          git diff --staged --quiet || (git commit -m "chore: refresh profile cards [skip ci]" && git push)
