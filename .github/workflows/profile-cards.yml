name: Refresh profile cards

on:
  schedule:
    - cron: "17 1 * * *"      # daily, 01:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [render_cards.py, assets/**, scripts/**]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: pip install fonttools pillow

      - name: Refresh contribution data
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) if you
          # want private contributions counted. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch_data.sh "${{ github.repository_owner }}"

      - name: Render cards
        run: python render_cards.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json cards README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
