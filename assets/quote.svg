<svg xmlns="http://www.w3.org/2000/svg" width="800" height="215" viewBox="0 0 800 215"><rect x="7" y="7" width="788" height="200" rx="14" fill="#0B0F1A"/><rect x="0" y="0" width="788" height="200" rx="14" fill="#FFC61A" stroke="#0B0F1A" stroke-width="2.5"/><text x="30" y="110" font-family="'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif" font-size="120" font-style="normal" font-weight="normal" letter-spacing="0" fill="#F03A2E" >“</text><text x="100" y="64" font-family="'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif" font-size="25" font-style="italic" font-weight="normal" letter-spacing="0" fill="#0B0F1A" >Your mind is like this water,</text><text x="100" y="98" font-family="'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif" font-size="25" font-style="italic" font-weight="normal" letter-spacing="0" fill="#0B0F1A" >When it is agitated, it becomes difficult to see.</text><text x="100" y="132" font-family="'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif" font-size="25" font-style="italic" font-weight="normal" letter-spacing="0" fill="#0B0F1A" >But, if you allow it to settle, the answer becomes clear.</text><text x="100" y="176" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" font-style="normal" font-weight="normal" letter-spacing="3" fill="#0B0F1A" >— MASTER OOGWAY</text></svg>