<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-labelledby="t d" style="--base:3.20s">
<title id="t">What I&#x27;m coding</title><desc id="d">Featured repositories</desc>
<style><![CDATA[@font-face{font-family:DS;font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:DS;font-weight:400;font-style:italic;src:url(data:font/woff;base64,) format("woff")}text{font-variant-ligatures:none;font-kerning:normal}.d{font-family:DS,'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;font-style:normal}.di{font-family:DS,'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;font-style:italic}
.in{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--base,0s) + var(--i,0)*.12s)}
.row{animation:fade .5s ease-out backwards;animation-delay:calc(var(--base,0s) + .25s + var(--i,0)*.025s)}
.ul{transform-box:fill-box;transform-origin:0 50%;animation:growx .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--base,0s) + .45s)}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:growy .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--base,0s) + .4s + var(--i,0)*.06s)}
.lab{animation:fade .5s ease-out backwards;animation-delay:calc(var(--base,0s) + 1.1s)}
.c{transform-box:fill-box;transform-origin:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--base,0s) + .3s + var(--i,0)*.02s)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.deco{display:none}}
]]></style>
<rect width="880" height="84" rx="18" fill="#F4F2ED"/><text class="d in" style="--i:0" x="36" y="56" font-size="42" fill="#111114">What I'm <tspan class="di">coding</tspan></text>
</svg>
