<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 92" width="888" height="92" role="img" aria-label="What I’m building"><title>What I’m building</title><style>@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;src:url(data:font/woff;base64,) format('woff')}.s{font-family:'Instrument Serif',Georgia,serif}.si{font-family:'Instrument Serif',Georgia,serif;font-style:italic}.n{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}.nb{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.a{white-space:pre}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleY(0)}}
.fade{animation:fade .5s ease-out var(--d,0s) backwards}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.still{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.live,.decor{display:none}
.still{display:inline}
}
</style><g class="fade" style="--d:4s"><rect x=".5" y=".5" width="887" height="91" rx="14" fill="#F3F1EC" stroke="#E4E1DA"/><g class="rise" style="--d:4.1s"><text x="36" y="62" font-size="42" fill="#141414" xml:space="preserve"><tspan class="s">What I’m </tspan><tspan class="si" fill="#2563EB">building</tspan></text></g></g></svg>
